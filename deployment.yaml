apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mini-devops
  template:
    metadata:
      labels:
        app: mini-devops
    spec:
      containers:
      - name: flask-api
        image: mini-devops:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          
        livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
        
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"